<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>CooAlert</title>
    <style>
      body { width: 320px; margin: 0; padding: 14px; font: 14px/1.5 system-ui, 'Malgun Gothic', sans-serif; }
      h1 { font-size: 16px; margin: 0 0 10px; }
      label { display: block; margin: 8px 0 4px; color: #555; }
      input[type='time'] { font: inherit; padding: 4px 6px; }
      button { margin-top: 10px; padding: 8px 12px; font: inherit; cursor: pointer; width: 100%; }
      #result { margin-top: 12px; padding: 8px; background: #f3f4f6; border-radius: 6px; white-space: pre-wrap; min-height: 20px; }
      #items { margin-top: 10px; font-size: 12px; }
      #items ol { margin: 4px 0 0; padding-left: 18px; max-height: 160px; overflow-y: auto; }
      #logs { margin: 8px 0 0; padding-left: 16px; color: #666; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>🛒 CooAlert</h1>
    <label for="time">매일 알림 시각</label>
    <input id="time" type="time" />
    <button id="save">시각 저장</button>
    <button id="run">지금 확인하기</button>
    <button id="kakao">카카오톡 연결</button>
    <div id="result"></div>
    <div id="items"></div>
    <ul id="logs"></ul>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
